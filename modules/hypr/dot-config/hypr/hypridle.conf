# defaults - override any of these in ~/.config/hypr/hypridle.d/*.conf
$lock_timeout = 1800 # 30 minutes
$dpms_timeout = 1830 # 30.5 minutes
$suspend_timeout = 3600 # 60 minutes
$suspend_cmd = true # no-op; set to "systemctl suspend" locally to enable

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # The Steam client might hold a D-Bus screensaver inhibit for as long as it
    # runs. If idle never triggers with Steam open, set this to true and rely on
    # the Wayland window rules (mpv, vlc, games) and the manual shortcut instead.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false # required for the inhibit shortcuts
    ignore_wayland_inhibit = false # required for the idle_inhibit window rules
}

# machine-local overrides and additions
source = ~/.config/hypr/hypridle.d/*.conf

# lock
listener {
    timeout = $lock_timeout
    on-timeout = loginctl lock-session
}

# displays off
listener {
    timeout = $dpms_timeout
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# suspend (no-op unless enabled locally)
listener {
    timeout = $suspend_timeout
    on-timeout = $suspend_cmd
}
